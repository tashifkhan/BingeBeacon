<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="BingeBeacon">
  <title>BingeBeacon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161C2C"/>
      <stop offset="1" stop-color="#0B0F1A"/>
    </linearGradient>
    <!-- The beam fades as it travels, so it reads as light rather than as a
         solid wedge. -->
    <linearGradient id="beam" x1="256" y1="330" x2="256" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="340" r="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed tile: everything sits inside the middle 80%, so a circular
       maskable crop never clips the mark. -->
  <rect width="512" height="512" fill="url(#tile)"/>

  <!-- Beam: apex at the lamp, opening upward, mouth softly curved. -->
  <path d="M256 344 L147 114 C217 88 295 88 365 114 Z" fill="url(#beam)"/>

  <!-- Halo around the lamp -->
  <circle cx="256" cy="344" r="120" fill="url(#halo)"/>

  <!-- The lamp. At favicon sizes the beam melts into a warm haze and this is
       what stays legible. -->
  <circle cx="256" cy="344" r="62" fill="#F59E0B"/>
  <circle cx="238" cy="326" r="20" fill="#FDE68A" opacity="0.55"/>
</svg>
