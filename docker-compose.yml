# ---------------------------------------------------------------
# BingeBeacon — production topology
#
#   caddy (80/443)  ->  web  (TanStack Start PWA, :3000)
#                   ->  api  (Go, :8080)  ->  postgres, redis
#
# Only Caddy publishes ports. Everything else talks over the compose
# network, so Postgres/Redis are never reachable from outside the host.
# Bring the stack up with:  docker compose up -d --build
# ---------------------------------------------------------------

name: bingebeacon

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bingebeacon-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-network overrides — these always win over .env.
      SERVER_ENVIRONMENT: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_ADDR: redis:6379
      FCM_CREDENTIALS_FILE: /app/secrets/firebase-credentials.json
    volumes:
      # Directory mount (not a file mount) so the stack still starts when no
      # Firebase service account has been dropped in yet — FCM is optional.
      - ./secrets:/app/secrets:ro
    expose:
      - "8080"
    # Uncomment to reach the API directly from the host for debugging:
    # ports:
    #   - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — change these and you
        # must rebuild (`docker compose build web`), not just restart.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    image: bingebeacon-web:latest
    restart: unless-stopped
    expose:
      - "3000"
    # ports:
    #   - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      POSTGRES_DB: ${DATABASE_DBNAME:-bingebeacon}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_DBNAME:-bingebeacon}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./data/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
